name: Deploy Production

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: ctype, iconv, mbstring, pdo_mysql, gd, intl, zip
          coverage: none

      - name: Install PHP dependencies
        # --no-scripts: composer.json's auto-scripts (cache:clear, sulu:media:init, ...)
        # need APP_ENV=prod and a reachable database, neither of which exist on this
        # runner yet. Cache/assets are instead built lazily on the first real request.
        run: composer install --no-dev --no-scripts --optimize-autoloader --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build website frontend
        working-directory: public/project/frontend
        run: |
          npm ci
          npm run build

      # The admin UI (assets/admin) uses a legacy toolchain that requires npm <7
      # (see assets/admin/.npmrc) and isn't reproducible on current CI runners.
      # Its build output is pre-built and committed under public/build/admin,
      # so it's deployed as-is together with the rest of the repository.

      # Uploading ~16k individual files (mostly vendor/) over FTP is far too slow
      # (hours). Instead we ship one zip archive plus two tiny PHP hooks, and
      # extract the archive server-side (see public/deploy-unpack.php).
      - name: Package deployment archive
        run: |
          mkdir -p _deploy/public
          cp public/deploy-unpack.php _deploy/public/deploy-unpack.php
          cp public/deploy-cache-clear.php _deploy/public/deploy-cache-clear.php
          zip -r _deploy/deploy-payload.zip . -x \
            "_deploy/*" ".git/*" ".git*" ".github/*" ".ddev/*" ".vscode/*" \
            "*/node_modules/*" "node_modules/*" \
            "tests/*" "var/*" \
            ".env.local" ".env.local.php" ".env.*.local" \
            "public/bundles/*" "public/uploads/*" \
            "docker-compose*.yml" "phpunit.xml.dist"

      # Real secrets never live in the repo. This file only exists on the
      # runner's temporary workspace and is uploaded straight to the server,
      # it is never committed. Written into the staging dir (not the repo
      # root) so it never ends up inside deploy-payload.zip.
      - name: Write production environment file
        run: |
          cat > _deploy/.env.local <<EOF
          APP_ENV=prod
          APP_DEBUG=0
          APP_URL=${{ secrets.APP_URL }}
          APP_SECRET=${{ secrets.APP_SECRET }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          MAILER_DSN=${{ secrets.MAILER_DSN }}
          SULU_ADMIN_EMAIL=${{ secrets.SULU_ADMIN_EMAIL }}
          DEPLOY_CACHE_CLEAR_TOKEN=${{ secrets.DEPLOY_CACHE_CLEAR_TOKEN }}
          EOF

      # Only 4 small files go over FTP now (zip + .env.local + 2 PHP hooks),
      # so this step finishes in seconds instead of hours.
      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: ./_deploy/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}

      # Shared hosting has no SSH, so the payload can't be unzipped or the
      # cache cleared via bin/console. Both hooks are token-protected (see
      # public/deploy-unpack.php and public/deploy-cache-clear.php).
      - name: Extract deployment archive
        run: |
          curl -fsS "${{ secrets.APP_URL }}/deploy-unpack.php?token=${{ secrets.DEPLOY_CACHE_CLEAR_TOKEN }}"

      - name: Clear production cache
        run: |
          curl -fsS "${{ secrets.APP_URL }}/deploy-cache-clear.php?token=${{ secrets.DEPLOY_CACHE_CLEAR_TOKEN }}"